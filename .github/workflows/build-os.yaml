name: Build OS

on:
  push:
    branches:
      - main
    paths:
      - 'deps/mkosi/*'
  pull_request:
    branches:
      - main
    paths:
      - 'deps/mkosi/*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # setup:
  #   uses: ./.github/workflows/setup-runners.yaml
  build-os-image:
    # needs: setup
    runs-on:
      - ${{ matrix.os }}
      # - ${{ fromJSON(needs.setup.outputs.runner-labels)[matrix.os] }}
      # - buildspec-override:true
    container:
      image: public.ecr.aws/ubuntu/ubuntu:25.04
    # env:
    #   arch: ${{ fromJSON(matrix.arch)[matrix.os] }}
    #   # arch: ${{ fromJSON(needs.setup.outputs.runner-arches)[matrix.os] }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # os: ${{ fromJSON(needs.setup.outputs.available-runners) }}
    timeout-minutes: 15
    steps:
      - name: Install packages
        run: |
          apt update --assume-yes
          apt install --assume-yes --no-install-recommends \
            git \
            debian-archive-keyring \
             dnf \
             systemd-boot \
             mtools \
             qemu-utils \
             ca-certificates \
             docker \
             docker-buildx
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      # - name: Set Docker
      #   uses: docker/setup-docker-action@3fb92d6d9c634363128c8cce4bc3b2826526370a # v4.4.0
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: rootfs-ecr-image-upload-session
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Install mkosi
        run: |
          mkdir -p "$HOME/.local/bin/"
          export PATH="/root/.local/bin/:$PATH"
          export GITHUB_ACTIONS=true
          ./deps/mkosi/install-mkosi.sh
      - name: Enable unprivileged user namespaces
        shell: bash
        run: |
          sysctl --ignore --write kernel.apparmor_restrict_unprivileged_unconfined=0
          sysctl --ignore --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Create missing mountpoints
        shell: bash
        run: |
          mkdir -p /var/lib/ca-certificates

      # # Both the unix-chkpwd and swtpm profiles are broken (https://gitlab.com/apparmor/apparmor/-/issues/402) so let's
      # # just disable and remove apparmor completely. It's not relevant in this context anyway.
      # # TODO: Remove if https://github.com/actions/runner-images/issues/10015 is ever fixed.
      # - name: Disable and mask apparmor service
      #   shell: bash
      #   run: |
      #     # This command fails with a non-zero error code even though it unloads the apparmor profiles.
      #     # https://gitlab.com/apparmor/apparmor/-/issues/403
      #     sudo aa-teardown || true
      #     sudo apt-get remove apparmor
      - name: mkosi arch
        id: mkosi-arch
        run: |
          arch=""
          if [ "$(uname -m)" == "aarch64" ]; then
            arch="arm64"
          else
            arch="x86-64"
          fi
          echo "arch=${arch}" >> $GITHUB_OUTPUT
      - name: Run build
        run: |
          ln -s "$HOME/.docker" /root/.docker
          export PATH="/root/.local/bin/:$PATH"
          cd ./deps/mkosi
          PATH="/root/.local/bin/:$PATH" \
            GITHUB_ACTIONS=true \
            ECR_CACHE_REPO="${{ secrets.ECR_CACHE_REPO }}" \
            ./build.sh
          arch="${{ steps.mkosi-arch.outputs.arch }}"
          qemu-img convert -f raw -c -O qcow2 "./out/${arch}/disk/image.raw" \
          "./out/${arch}/disk/image.qcow2"
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ steps.mkosi-arch.outputs.arch }}-${{github.run_id}}.qcow2
          path: ./deps/mkosi/out/${{ steps.mkosi-arch.outputs.arch }}/disk/image.qcow2
          if-no-files-found: error
