name: Build OS

on:
  push:
    branches:
      - main
    paths:
      - 'deps/mkosi/*'
  pull_request:
    branches:
      - main
    paths:
      - 'deps/mkosi/*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-os-image:
    runs-on:
      - ${{ matrix.os }}
    container:
      image: public.ecr.aws/docker/library/fedora:43
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 15
    steps:
      - name: Install packages
        run: |
          dnf install -y git \
            systemd-boot \
            systemd-repart \
            systemd-ukify \
            qemu-img \
            docker \
            jq \
            xfsprogs \
            dosfstools \
            cpio \
            zstd \
            procps-ng \
            distribution-gpg-keys \
            openssl \
            mtools
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: rootfs-ecr-image-upload-session
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Install mkosi
        run: |
          mkdir -p "$HOME/.local/bin/"
          export PATH="/root/.local/bin/:$PATH"
          export GITHUB_ACTIONS=true
          ./deps/mkosi/install-mkosi.sh
      - name: mkosi arch
        id: mkosi-arch
        shell: bash
        run: |
          arch=""
          if [ "$(uname -m)" == "aarch64" ]; then
            arch="arm64"
          else
            arch="x86-64"
          fi
          echo "arch=${arch}" >> $GITHUB_OUTPUT
      - name: Run build
        run: |
          ln -s "$HOME/.docker" /root/.docker
          export PATH="/root/.local/bin/:$PATH"
          echo "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          cd ./deps/mkosi
          PATH="/$HOME/.local/bin/:$PATH" \
            GITHUB_ACTIONS=true \
            ECR_CACHE_REPO="${{ secrets.ECR_CACHE_REPO }}" \
            ./build.sh
          arch="${{ steps.mkosi-arch.outputs.arch }}"
          sudo qemu-img convert -f raw -c -O qcow2 "./out/${arch}/disk/image.raw" \
          "./out/${arch}/disk/image.qcow2"
      - name: Run container build
        if: steps.mkosi-arch.outputs.arch == 'x86-64'
        run: |
          set -x
          cd ./deps/mkosi
          arch="${{ steps.mkosi-arch.outputs.arch }}"
          PATH="/$HOME/.local/bin/:$PATH" ./mkosi.sh --format oci --arch $arch
          ls "./out/${arch}/oci/"
          ls "./out/${arch}/oci/image"
          tar -cvf "./out/${arch}/oci/image.tar" "./out/${arch}/oci/image"
          ls "./out/${arch}/oci/"
          # image_id=$(docker load -i "./out/${arch}/oci/image.tar" | awk '{print $NF}')
          # docker image ls
          # echo "Loaded image ID: ${image_id}"
          # docker tag "${image_id}" "finch-os:latest"
          # docker image ls
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ steps.mkosi-arch.outputs.arch }}-${{github.run_id}}.qcow2
          path: ./deps/mkosi/out/${{ steps.mkosi-arch.outputs.arch }}/disk/image.qcow2
          if-no-files-found: error
      - name: Upload artifacts
        if: steps.mkosi-arch.outputs.arch == 'x86-64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-oci-${{ steps.mkosi-arch.outputs.arch }}-${{github.run_id}}.tar
          path: ./deps/mkosi/out/${{ steps.mkosi-arch.outputs.arch }}/oci/image.tar
          if-no-files-found: error
