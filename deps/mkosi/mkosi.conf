[Distribution]
Distribution=amazonlinux
Release=latest

[Build]
ToolsTreeDistribution=fedora

[Content]
Packages=
        kernel6.12
        kernel6.12-modules-extra
        systemd
        udev
        cloud-init
        chrony
        systemd-resolved
        systemd-networkd
        #NetworkManager
        bash
        dnf
        sudo
        iptables
        setup
        # fuse-sshfs
        shadow-utils
        selinux-policy
        tar
        fuse3
        fuse3-libs
        openssh-clients
        # sshd
        openssh-server
        system-release
        filesystem
        systemd-boot-unsigned
        cloud-utils-growpart

BuildPackages=
        libselinux
        libselinux-utils

WithRecommends=no

# RemovePackages=dracut-config-rescue
#                plymouth
#                firewalld
#                geolite2-country
#                geolite2-city

CleanPackageMetadata=no
RootPassword=test1234

[Build]
CacheOnly=auto
Incremental=yes